<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — JKS Medtech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050a12;
    color: #e8e6e1;
    font-family: 'DM Sans', sans-serif;
    text-align: center;
    padding: 24px;
  }
  .container { max-width: 520px; }
  .code {
    font-family: 'Syne', sans-serif;
    font-size: clamp(80px, 15vw, 140px);
    font-weight: 800;
    background: linear-gradient(135deg, #00d4c8, #c9a84c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 16px;
  }
  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 700;
    margin-bottom: 12px;
  }
  p {
    color: #8a8f98;
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 32px;
  }
  .btn {
    display: inline-block;
    padding: 14px 36px;
    background: #00d4c8;
    color: #050a12;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-decoration: none;
    border-radius: 6px;
    transition: background 0.3s, transform 0.2s;
  }
  .btn:hover { background: #00f0e0; transform: translateY(-2px); }
  .sub-link {
    display: block;
    margin-top: 16px;
    color: #c9a84c;
    font-size: 13px;
    text-decoration: none;
  }
  .sub-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <div class="code">404</div>
  <h1>This Page Doesn't Exist</h1>
  <p>The page you're looking for may have been moved or doesn't exist. Let's get you back to where the innovation happens.</p>
  <a href="/" class="btn">Back to Homepage</a>
  <a href="/#contact" class="sub-link">Or contact our team</a>
</div>
</body>
</html>
